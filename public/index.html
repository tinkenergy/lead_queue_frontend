<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Lead-Warteschlange</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23007F55'/%3E%3Cpath d='M10 9v14h12' stroke='white' stroke-width='3' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/styles.css">
</head>
<body>
<main>
  <div class="bar top">
    <span class="queue" id="queue" aria-live="polite"></span>
    <div class="who-box">
      <div class="who-actions">
        <button id="inactive" type="button" class="quiet tiny" hidden>Inaktiv</button>
        <button id="logout" type="button" class="tiny danger" hidden>Logout</button>
      </div>
      <span class="who" id="who"></span>
    </div>
  </div>

  <div id="slot" aria-live="polite">
    <div class="card" aria-busy="true">
      <div class="skeleton short"></div>
      <div class="skeleton big"></div>
      <div class="skeleton"></div>
      <div class="skeleton short"></div>
      <span class="sr-only">Wird geladen</span>
    </div>
  </div>

  <div class="notice" id="notice" hidden></div>

  <div class="bar">
    <button id="skip" type="button" class="quiet" hidden>Skip (nicht angerufen)</button>
    <button id="next" type="button" disabled>Lead holen</button>
  </div>
</main>
<script src="/app.js" defer></script>
</body>
</html>

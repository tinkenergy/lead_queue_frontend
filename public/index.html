<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Lead-Queue</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='12' cy='16' r='8' fill='%23007F55'/%3E%3Ccircle cx='22' cy='16' r='8' fill='%23FFC93C'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="/tokens.css">
<link rel="stylesheet" href="/tl.css">
<link rel="stylesheet" href="/app.css">
</head>
<body class="tl">
<div class="tl-page lq-page">
  <header class="tl-top lq-top">
    <span class="tl-logo"><i></i>Lead-Queue</span>
    <div id="stats" class="lq-stats"></div>
    <div class="tl-row lq-top__right">
      <button id="pause" class="tl-btn tl-btn--sm" type="button" hidden
        title="Gibt deinen Lead zurück. Du bekommst keine neuen Leads, bis du weitermachst.">Pause</button>
      <div class="lq-menuwrap">
        <button id="user" class="tl-user" type="button" aria-haspopup="menu" aria-expanded="false"></button>
        <div id="menu" class="tl-menu lq-menu" role="menu" hidden></div>
      </div>
    </div>
  </header>

  <main class="lq-main">
    <div id="filters" class="lq-filters"></div>
    <div id="alerts" class="lq-alerts" aria-live="polite"></div>
    <div id="slot" class="lq-slot" aria-live="polite">
      <div class="tl-card tl-card--plain" aria-busy="true" aria-label="Wird geladen">
        <span class="tl-skel" style="width:120px;height:24px;border-radius:999px"></span>
        <span class="tl-skel" style="width:70%;height:48px;margin-top:16px"></span>
      </div>
    </div>
    <div id="actions" class="lq-actions"></div>
    <aside id="today" class="lq-today" aria-label="Heute"></aside>
    <section id="tasks" class="lq-tasks"></section>
  </main>
</div>
<div id="toast" class="lq-toast" aria-live="polite"></div>
<div id="modal"></div>
<script src="/app.js" defer></script>
</body>
</html>
